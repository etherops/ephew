[project]
name = "ephew"
version = "0.1.0"
description = "Local passthrough proxy for the Anthropic API. Pre-MVP milestone."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Patrick Kennel" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ephew = "ephew.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ephew"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
